services:
  app:
    build: .
    ports: ["8000:80"]
    env_file: .env
    depends_on: [db]
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports: ["3307:3306"]
volumes:
  mysql_data: